[workspace]
members = [
    "auth-test",
    "comm-common",
    "comm-test",
    "core",
    "verder-helpen-common",

    # for testing only
    "auth-digid/test-jwt",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
accept-language = "3.1.0"
askama = "0.12.1"
base64 = "0.13.1"
chrono = "0.4.38"
figment = "0.10.19"
httpmock = "0.7.0"
josekit = "0.8.7"
log = "0.4.22"
nutype = "0.4.3"
postgres = "0.19.8"
rand = "0.8.5"
reqwest = "0.11.27"
rocket = "0.5.1"
rocket_oauth2 = "0.5.0"
rocket_sync_db_pools = "0.1.0"
serde = "1.0.204"
serde_json = "1.0.121"
serde_yaml = "0.9.34"
serial_test = "3.1.1"
strum = "0.26.3"
strum_macros = "0.26.4"
tera = "1.20.0"
toml = "0.8.17"
thiserror = "1.0.63"
tokio-test = "0.4.4"
unic-langid = "0.9.5"
url = "2.5.2"

[patch.crates-io]
rocket_oauth2 = { git = "https://github.com/atezet/rocket_oauth2.git", rev = "44d596d4f219816b287f525b1bc8260cb0229262" }
